
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Fetch Downloader</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080d18;
    color: white;
    min-height: 100vh;
}

header {
    padding: 25px;
    text-align: center;
    background: #101a2e;
    border-bottom: 1px solid #263653;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #00e5ff;
}

header p {
    color: #aab8d0;
    margin-top: 8px;
}

main {
    max-width: 650px;
    margin: 80px auto;
    padding: 25px;
    text-align: center;
}

h1 {
    font-size: 36px;
    margin-bottom: 15px;
}

h1 span {
    color: #00e5ff;
}

.description {
    color: #aab8d0;
    line-height: 1.7;
    margin-bottom: 30px;
}

.download-box {
    background: #111d32;
    padding: 25px;
    border-radius: 15px;
    border: 1px solid #263c5d;
}

input {
    width: 100%;
    padding: 16px;
    border-radius: 9px;
    border: 1px solid #405573;
    background: #080d18;
    color: white;
    font-size: 15px;
    outline: none;
    margin-bottom: 15px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 9px;
    background: #00d9ee;
    color: #07111e;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #00bcd4;
}

#message {
    margin-top: 18px;
    line-height: 1.6;
    color: #00e5ff;
}

.features {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: 30px;
}

.feature {
    background: #111d32;
    padding: 15px;
    border-radius: 10px;
    color: #c4d3e9;
}

footer {
    text-align: center;
    padding: 25px;
    color: #8292ac;
    font-size: 13px;
}

a {
    color: #00e5ff;
}
</style>
</head>

<body>

<header>
    <div class="logo">⚡ CYBER FETCH</div>
    <p>Smart Video Link Assistant</p>
</header>

<main>

    <h1>Cyber <span>Fetch</span> Downloader</h1>

    <p class="description">
        Paste a TikTok video link below to get started.
        Simple, clean and user-friendly interface.
    </p>

    <div class="download-box">

        <input
            type="url"
            id="videoUrl"
            placeholder="Paste TikTok video URL here..."
        >

        <button onclick="processLink()">
            Fetch Video Link ⚡
        </button>

        <div id="message"></div>

    </div>

    <div class="features">
        <div class="feature">⚡ Easy to Use</div>
        <div class="feature">🔗 Link Validation</div>
        <div class="feature">📱 Mobile Friendly</div>
    </div>

</main>

<footer>
    <p>© 2026 Cyber Fetch Downloader</p>
    <p>
        <a href="privacy.md">Privacy Policy</a> |
        <a href="terms.md">Terms of Service</a>
    </p>
</footer>

<script>
function processLink() {

    const url = document.getElementById("videoUrl").value.trim();
    const message = document.getElementById("message");

    if (!url) {
        message.textContent = "Please paste a video URL first.";
        return;
    }

    try {
        const parsed = new URL(url);

        const valid =
            parsed.protocol === "https:" &&
            (
                parsed.hostname === "tiktok.com" ||
                parsed.hostname.endsWith(".tiktok.com")
            );

        if (!valid) {
            message.textContent = "Please enter a valid TikTok URL.";
            return;
        }

        message.textContent =
            "Valid TikTok link received. Connect an authorized backend to process videos.";

    } catch (error) {
        message.textContent = "Invalid URL. Please try again.";
    }
}
</script>

</body>
</html>
